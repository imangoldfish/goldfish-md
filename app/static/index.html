<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>goldfish-md</title>
  <script>
    // Apply the saved theme before first paint to avoid a flash of the wrong
    // scheme. Fails silently if storage is blocked (defaults to system).
    try {
      var t = localStorage.getItem("custommd.theme");
      if (t === "light" || t === "dark" || t === "system") {
        document.documentElement.dataset.theme = t;
      }
    } catch (e) {}
  </script>
  <link rel="stylesheet" href="/styles.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📝</text></svg>" />
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <header class="sidebar-head">
        <span class="brand">📝 goldfish-md</span>
        <div class="actions">
          <button id="new-file" title="New note">New note</button>
          <button id="new-folder" title="New folder">New folder</button>
          <button id="open-device" title="Open notes from your device">Import…</button>
          <button id="refresh" title="Refresh tree">⟳</button>
        </div>
        <input id="file-input" type="file" accept=".md,.markdown,text/markdown" multiple hidden />
        <div id="status" class="status hidden" role="status" aria-live="polite"></div>
      </header>

      <div class="search">
        <input id="search" type="search" placeholder="Search notes…" autocomplete="off" />
      </div>

      <nav id="tree" class="tree" aria-label="Notes"></nav>
      <div id="search-results" class="search-results hidden" aria-label="Search results"></div>
    </aside>

    <main id="main">
      <header id="toolbar">
        <button id="toggle-sidebar" title="Toggle file tree">☰</button>
        <span id="current-path" class="path">No file open</span>
        <span id="dirty" class="dirty hidden">● unsaved</span>
        <div class="spacer"></div>
        <button id="theme-toggle" title="Theme">🖥️</button>
        <button id="save" disabled>Save</button>
        <div class="view-toggle" role="group" aria-label="View">
          <button data-view="split" class="active">Split</button>
          <button data-view="edit">Edit</button>
          <button data-view="preview">Preview</button>
        </div>
      </header>

      <section id="workspace" data-view="split">
        <textarea id="editor" spellcheck="false" placeholder="Select a note…"></textarea>
        <article id="preview" class="markdown-body"></article>
      </section>
    </main>
  </div>

  <div id="drop-hint" class="drop-hint hidden">Drop <strong>.md</strong> notes here to import them into the vault</div>

  <script src="/vendor/marked.min.js"></script>
  <script src="/vendor/purify.min.js"></script>
  <script src="/highlight.js"></script>
  <script src="/app.js"></script>
</body>
</html>
